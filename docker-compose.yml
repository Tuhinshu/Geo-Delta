version: '3.8'

# ==============================================================================
# GeoDelta GEOINT Platform - Multi-Container Air-Gapped Stack
# Problem Statement: SIH26227 (Ministry of Defence, Government of India)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 with PostGIS 3.4 Spatial Database
  # ----------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: geodelta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geodelta_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geodelta_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-geodelta_geoint}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geodelta_admin} -d ${POSTGRES_DB:-geodelta_geoint}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - geodelta_net

  # ----------------------------------------------------------------------------
  # 2. Redis Message Broker & Feature Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: geodelta_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - geodelta_net

  # ----------------------------------------------------------------------------
  # 3. MinIO S3-Compatible Local Object Store
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: geodelta_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - geodelta_net

  # ----------------------------------------------------------------------------
  # 4. Bucket Provisioner (Creates default COG, Dossier, and Model buckets)
  # ----------------------------------------------------------------------------
  createbuckets:
    image: minio/mc:RELEASE.2024-03-30T15-32-40Z
    container_name: geodelta_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minio_admin} ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_COGS:-cog-rasters};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_DOSSIERS:-dossiers};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_MODELS:-model-weights};
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_COGS:-cog-rasters};
      exit 0;
      "
    networks:
      - geodelta_net

  # ----------------------------------------------------------------------------
  # 5. TiTiler Dynamic XYZ Cloud-Optimized GeoTIFF Tile Proxy
  # ----------------------------------------------------------------------------
  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: geodelta_titiler
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_VIRTUAL_HOSTING: "FALSE"
      TITILER_ROUTER_PREFIX: "/titiler"
      CUDD_MAX_WORKERS: "4"
    ports:
      - "8001:8000"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - geodelta_net

  # ----------------------------------------------------------------------------
  # 6. FastAPI Backend API Gateway
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geodelta_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://geodelta_admin:geodelta_secure_pass_2026@db:5432/geodelta_geoint}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgresql://geodelta_admin:geodelta_secure_pass_2026@db:5432/geodelta_geoint}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
      - SECRET_KEY=${SECRET_KEY:-geodelta-tactical-secret-key-mod-sih26227}
      - MODEL_WEIGHTS_DIR=/models/weights
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage/models:/models/weights:ro
      - ./storage/samples:/samples:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - geodelta_net

  # ----------------------------------------------------------------------------
  # 7. Celery GPU Inference Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geodelta_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info -c 2 -E
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://geodelta_admin:geodelta_secure_pass_2026@db:5432/geodelta_geoint}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgresql://geodelta_admin:geodelta_secure_pass_2026@db:5432/geodelta_geoint}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
      - MODEL_WEIGHTS_DIR=/models/weights
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    volumes:
      - ./backend:/app
      - ./storage/models:/models/weights:ro
      - ./storage/samples:/samples:ro
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - geodelta_net

  # ----------------------------------------------------------------------------
  # 8. Next.js 14 Geospatial Tactical Dashboard
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geodelta_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_TITILER_URL=http://localhost:8001
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - geodelta_net

# ==============================================================================
# Persistent Storage Volumes & Networks
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  geodelta_net:
    driver: bridge
